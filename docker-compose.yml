version: "3.9"

services:
  api:
    build: .
    container_name: delivery_service_api
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    command: >
      uvicorn delivery_service.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16
    container_name: delivery_service_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery_service}
      POSTGRES_USER: ${POSTGRES_USER:-delivery_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery_password}
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: delivery_service_redis
    ports:
      - "6379:6379"

  celery-worker:
    build: .
    container_name: delivery_service_celery
    env_file:
      - .env.example
    depends_on:
      - api
      - redis
    command: celery -A delivery_service.tasks.celery_app.celery_app worker -l info

